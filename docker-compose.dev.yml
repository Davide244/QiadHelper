# Dev-only PostgreSQL for F5 / `dotnet run` workflows. The full-stack compose keeps the
# database internal-only; this one publishes 5432 so the locally-running app can reach it.
# Credentials match appsettings.Development.json — start it once and forget it:
#   docker compose -f docker-compose.dev.yml up -d
services:
  qiad-db-dev:
    image: postgres:17-alpine
    container_name: qiad-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=qiad
      - POSTGRES_USER=qiad
      - POSTGRES_PASSWORD=qiad
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiad -d qiad"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - qiad-db-dev-data:/var/lib/postgresql/data

volumes:
  qiad-db-dev-data:
